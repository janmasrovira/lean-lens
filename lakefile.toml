name = "lean-lens"
version = "0.1.0"
defaultTargets = ["lean-lens"]

[leanOptions]
pp.unicode.fun = true
pp.fieldNotation = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanLens"

[[lean_exe]]
name = "lean-lens"
root = "Main"
